<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DexPad Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="panel">
    <div class="header">
      <div>
        <div class="eyebrow">LOCAL DESKTOP WORKSPACE</div>
        <h1>DexPad</h1>
        <p>Your workspace stays on this computer.</p>
      </div>
      <button id="open" class="secondary">Open</button>
    </div>

    <section class="toggles">
      <label class="row"><span><strong>Start with Windows</strong><small>Launch DexPad when you sign in.</small></span><input id="startup" type="checkbox" /></label>
      <label class="row"><span><strong>Desktop Wallpaper</strong><small>Show your saved workspace behind the desktop icons.</small></span><input id="wallpaper" type="checkbox" /></label>
    </section>

    <div class="actions">
      <span id="status">Loading…</span>
      <button id="save">Save</button>
    </div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
