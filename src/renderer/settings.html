<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DexPad — Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="panel" role="main">

    <header class="s-header">
      <div class="s-logo">
        <span class="s-mark" aria-hidden="true">D</span>
        <div>
          <h1>DexPad</h1>
          <p>Local desktop workspace — no account required.</p>
        </div>
      </div>
      <button type="button" id="btn-open" class="btn-secondary">Open workspace</button>
    </header>

    <section class="s-section" aria-labelledby="prefs-heading">
      <h2 id="prefs-heading" class="s-section-title">Preferences</h2>

      <label class="s-row" for="chk-startup">
        <span class="s-row-text">
          <strong>Start with Windows</strong>
          <small>Launch DexPad automatically when you sign in.</small>
        </span>
        <input type="checkbox" id="chk-startup" role="switch" />
      </label>

      <label class="s-row" for="chk-wallpaper">
        <span class="s-row-text">
          <strong>Desktop Wallpaper</strong>
          <small>Show your saved workspace behind your desktop icons.</small>
        </span>
        <input type="checkbox" id="chk-wallpaper" role="switch" />
      </label>
    </section>

    <footer class="s-footer">
      <span id="status" class="s-status" aria-live="polite">Loading…</span>
      <div class="s-actions">
        <button type="button" id="btn-save" class="btn-primary">Save settings</button>
      </div>
    </footer>

  </main>
  <script src="settings.js"></script>
</body>
</html>
