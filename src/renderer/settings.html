<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DexPad Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="panel">
    <div class="header">
      <div>
        <div class="eyebrow">LOCAL DESKTOP WORKSPACE</div>
        <h1>DexPad</h1>
        <p>Your workspace stays on this computer — no accounts, no sync.</p>
      </div>
      <button id="open" type="button" class="secondary">Open workspace</button>
    </div>

    <section class="toggles" aria-label="Settings">
      <label class="row">
        <span>
          <strong>Start with Windows</strong>
          <small>Launch DexPad automatically when you sign in.</small>
        </span>
        <input id="startup" type="checkbox" role="switch" aria-checked="false" />
      </label>
      <label class="row">
        <span>
          <strong>Desktop Wallpaper</strong>
          <small>Show your saved workspace behind the desktop icons.</small>
        </span>
        <input id="wallpaper" type="checkbox" role="switch" aria-checked="false" />
      </label>
    </section>

    <div class="actions">
      <span id="status" aria-live="polite">Loading…</span>
      <button id="save" type="button">Save settings</button>
    </div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
