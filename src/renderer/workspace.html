<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DexPad</title>
  <link rel="stylesheet" href="workspace.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">D</div><div><strong>DexPad</strong><span id="mode-label">Spatial workspace</span></div></div>
      <div id="profile-tabs" class="profiles"></div>
      <div class="top-actions">
        <button id="btn-undo" class="ghost" title="Undo">↶</button>
        <button id="btn-redo" class="ghost" title="Redo">↷</button>
        <button id="btn-search" class="search-trigger">Search <kbd>Ctrl F</kbd></button>
        <button id="btn-save" class="save">Save</button>
      </div>
    </header>
    <div class="layout">
      <aside class="rail">
        <button id="btn-add" class="rail-add">+ Add</button>
        <div id="add-menu" class="popover" hidden>
          <button data-add="note">Note</button><button data-add="todo">Todo</button><button data-add="link">Link</button>
          <button data-add="markdown">Markdown</button><button data-add="image">Image</button><button data-add="file">File</button>
          <button data-add="column">Column</button><button data-add="group">Group</button><button data-add="board">Board</button>
        </div>
        <div class="rail-label">View</div>
        <button class="rail-item active" data-filter="all">All <span id="count-all">0</span></button>
        <button class="rail-item" data-filter="note">Notes <span id="count-note">0</span></button>
        <button class="rail-item" data-filter="todo">Tasks <span id="count-todo">0</span></button>
        <button class="rail-item" data-filter="link">Links <span id="count-link">0</span></button>
        <button class="rail-item" data-filter="favorite">Pinned <span id="count-favorite">0</span></button>
        <div class="rail-spacer"></div>
        <button id="btn-command" class="rail-item">⌘ Commands</button>
        <button id="btn-templates" class="rail-item">Templates</button>
        <button id="btn-import" class="rail-item">Import</button>
        <button id="btn-export" class="rail-item">Export</button>
      </aside>
      <main id="canvas" class="canvas">
        <div class="canvas-grid"></div>
        <svg id="connections" class="connections" aria-hidden="true"></svg>
        <div id="world" class="world"></div>
        <div id="empty-state" class="empty-state" hidden><strong>Your space is empty</strong><span>Add a block to start.</span></div>
        <div id="selection-toolbar" class="selection-toolbar" hidden><span id="selection-count">0 selected</span><button id="btn-delete-selected">Delete</button></div>
        <div class="zoom"><button id="btn-zoom-out">−</button><span id="zoom-level">100%</span><button id="btn-zoom-in">+</button><button id="btn-zoom-reset">Reset</button></div>
      </main>
    </div>
    <div id="search-overlay" class="overlay" hidden><div class="panel"><div class="panel-head"><input id="search-input" placeholder="Search blocks…" autofocus><button data-close-overlay="search-overlay">×</button></div><div id="search-results"></div></div></div>
    <div id="command-overlay" class="overlay" hidden><div class="panel"><div class="panel-head"><input id="command-input" placeholder="Type a command…" autofocus><button data-close-overlay="command-overlay">×</button></div><div id="command-results"></div></div></div>
    <input id="import-input" type="file" accept="application/json,.json" hidden>
  </div>
  <script src="debug.js"></script><script src="blocks/registry.js"></script><script src="profiles.js"></script><script src="workspace.js"></script>
</body>
</html>
