<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DexPad</title>
  <link rel="stylesheet" href="workspace.css" />
</head>
<body>
  <div id="app" class="app-shell">

    <header class="toolbar" role="banner">
      <div class="brand" aria-label="DexPad">
        <span class="brand-mark" aria-hidden="true">D</span>
        <div class="brand-text">
          <strong>DexPad</strong>
          <small id="mode-label">Local workspace</small>
        </div>
      </div>
      <nav id="controls" class="controls" aria-label="Add cards">
        <button type="button" data-add="note"  id="btn-note">+ Note</button>
        <button type="button" data-add="todo"  id="btn-todo">+ Todo</button>
        <button type="button" data-add="link"  id="btn-link">+ Link</button>
        <button type="button" id="btn-save" class="primary">Save</button>
      </nav>
    </header>

    <main id="canvas" class="canvas" aria-label="Spatial canvas">
      <div id="world" class="world"></div>
    </main>

    <div id="empty-state" class="empty-state" aria-live="polite" hidden>
      <div class="empty-icon" aria-hidden="true">✦</div>
      <strong>Your desktop, organized.</strong>
      <span>Add notes, todos, and links on an infinite spatial canvas.<br>Pan with middle-click or spacebar drag. Stored 100% locally.</span>
    </div>

    <aside id="zoom-hud" class="zoom-hud" aria-label="Canvas navigation">
      <button type="button" id="btn-zoom-out" class="zoom-btn" title="Zoom out (Ctrl -)">−</button>
      <span id="zoom-level" class="zoom-level">100%</span>
      <button type="button" id="btn-zoom-in" class="zoom-btn" title="Zoom in (Ctrl +)">+</button>
      <button type="button" id="btn-zoom-reset" class="zoom-btn reset" title="Reset view (Ctrl 0)">Reset</button>
    </aside>

  </div>
  <script src="workspace.js"></script>
</body>
</html>
