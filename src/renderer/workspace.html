<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DexPad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="workspace.css" />
</head>
<body>
  <div id="app" class="app-shell">

    <header class="toolbar" role="banner">
      <div class="brand" aria-label="DexPad">
        <span class="brand-mark" aria-hidden="true">D</span>
        <div class="brand-text">
          <strong>DexPad</strong>
          <small id="mode-label">Local workspace</small>
        </div>
      </div>
      <nav id="controls" class="controls" aria-label="Add cards">
        <button type="button" data-add="note"  id="btn-note">+ Note</button>
        <button type="button" data-add="todo"  id="btn-todo">+ Todo</button>
        <button type="button" data-add="link"  id="btn-link">+ Link</button>
        <button type="button" id="btn-save" class="primary">Save</button>
      </nav>
    </header>

    <main id="canvas" class="canvas" aria-label="Cards canvas"></main>

    <div id="empty-state" class="empty-state" aria-live="polite" hidden>
      <div class="empty-icon" aria-hidden="true">✦</div>
      <strong>Your desktop, organized.</strong>
      <span>Add notes, todos, and links.<br>Everything is stored locally — no cloud.</span>
    </div>

  </div>
  <script src="workspace.js"></script>
</body>
</html>
